name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            task: release:build:windows:amd64
            asset: windows-amd64.zip
          - platform: macos-amd64
            runner: macos-15-intel
            task: release:build:macos:amd64
            asset: macos-amd64.tar.gz
          - platform: macos-arm64
            runner: macos-15
            task: release:build:macos:arm64
            asset: macos-arm64.tar.gz
          - platform: linux-amd64
            runner: ubuntu-24.04
            task: release:build:linux:amd64
            asset: linux-amd64.tar.gz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            task: release:build:linux:arm64
            asset: linux-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew install protobuf

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --no-progress -y

      - name: Install project build tools
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go

      - name: Build release asset
        shell: bash
        run: |
          version="$(go run ./scripts/release version -config ./build/config.yml)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build/config.yml version v${version}." >&2
            exit 1
          fi

          wails3 task common:update:build-assets
          wails3 task "${{ matrix.task }}"
          source="bin/release/${version}/cursor-byok-${version}-${{ matrix.asset }}"
          mkdir -p artifacts
          cp "$source" artifacts/

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Prepare manifest
        shell: bash
        run: |
          version="$(go run ./scripts/release version -config ./build/config.yml)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match build/config.yml version v${version}." >&2
            exit 1
          fi

          release_dir="bin/release/${version}"
          mkdir -p "$release_dir"
          cp artifacts/* "$release_dir/"
          cp release-notes.md "$release_dir/.release-notes.md"

          expected=(
            "cursor-byok-${version}-windows-amd64.zip"
            "cursor-byok-${version}-macos-amd64.tar.gz"
            "cursor-byok-${version}-macos-arm64.tar.gz"
            "cursor-byok-${version}-linux-amd64.tar.gz"
            "cursor-byok-${version}-linux-arm64.tar.gz"
          )
          for asset in "${expected[@]}"; do
            test -f "$release_dir/$asset" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

          go run ./scripts/release manifest \
            -config ./build/config.yml \
            -assets-dir "$release_dir" \
            -out "$release_dir/update.json" \
            -repo "$GITHUB_REPOSITORY" \
            -base-name cursor-byok \
            -notes "$release_dir/.release-notes.md"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$RELEASE_DIR"/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* \
              --target "$GITHUB_SHA" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
